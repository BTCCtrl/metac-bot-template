name: Test Bot

on:
  workflow_dispatch:

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run offline tests (no network, no LLM calls) # [FREE MODE]
        run: uv run --with pytest pytest -q tests
      - name: Run bot
        run: |
          uv run python main.py --mode test_questions
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # [FREE MODE] free = only OpenRouter ":free" models ($0). paid = original template.
          # Optional knobs (repository variables; empty = safe defaults for 50 requests/day).
          BOT_MODE: ${{ vars.BOT_MODE || 'free' }}
          FREE_MODEL: ${{ vars.FREE_MODEL }}
          FREE_PARSER_MODEL: ${{ vars.FREE_PARSER_MODEL }}
          MAX_LLM_CALLS_PER_RUN: ${{ vars.MAX_LLM_CALLS_PER_RUN }}
          MAX_QUESTIONS_PER_RUN: ${{ vars.MAX_QUESTIONS_PER_RUN }}
          PREDICTIONS_PER_REPORT: ${{ vars.PREDICTIONS_PER_REPORT }}
          # [FREE RESEARCH] gdelt (default) = free news headlines from the GDELT Project
          # (no key, no LLM request); off = no research. Days back: 1-90 (default 30).
          FREE_RESEARCH: ${{ vars.FREE_RESEARCH }}
          FREE_RESEARCH_DAYS: ${{ vars.FREE_RESEARCH_DAYS }}
